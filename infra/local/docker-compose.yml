name: literabit-local

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: literabit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: literabit
      POSTGRES_USER: literabit
      POSTGRES_PASSWORD: local-postgres-password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - literabit_postgres_data:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U literabit -d literabit"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  literabit_postgres_data:
    name: literabit-postgres-data
