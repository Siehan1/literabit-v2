name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Dependency security audit
        run: bun audit --audit-level=moderate
      - run: bun run fmt
      - run: bun run lint
      - run: bun run type-check

  unit-and-build:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      APP_ENV: test
      DATABASE_URL: postgres://literabit:local-postgres-password@localhost:5432/literabit_test
      AUTH_SECRET: ci-build-placeholder-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build

  integration:
    name: Infrastructure integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: literabit
          POSTGRES_USER: literabit
          POSTGRES_PASSWORD: local-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U literabit -d literabit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      APP_VERSION: 0.1.0
      DATABASE_URL: postgres://literabit:local-postgres-password@localhost:5432/literabit_test
      TEST_DATABASE_URL: postgres://literabit:local-postgres-password@localhost:5432/literabit_test
      AUTH_SECRET: ci-integration-placeholder-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run db:test:prepare
      - run: bun run test:integration
